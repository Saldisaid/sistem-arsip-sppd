{% extends "base_admin.html" %}

{% block content %}
<div class="mx-auto max-w-2xl rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
    <div class="mb-6">
        <h2 class="text-2xl font-semibold text-slate-900">Password Berhasil Diubah</h2>
        <p class="mt-2 text-sm text-slate-600">Password Anda telah berhasil diperbarui. Silakan gunakan password baru saat login berikutnya.</p>
    </div>

    <div class="flex flex-wrap gap-3">
        <a href="{% url 'accounts:dashboard' %}" class="inline-flex items-center justify-center rounded-lg bg-[#660300] px-5 py-3 text-sm font-semibold text-white hover:bg-[#4f0200]">Kembali ke Dashboard</a>
        <button type="button" onclick="history.back()" class="inline-flex items-center justify-center rounded-lg border border-slate-300 bg-white px-5 py-3 text-sm font-semibold text-slate-700 hover:bg-slate-50">Kembali</button>
    </div>
</div>
{% endblock %}
