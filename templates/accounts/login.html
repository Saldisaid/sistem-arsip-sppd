<!doctype html>
<html lang="id">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Masuk | E-SPPD KPU Tolitoli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input:focus { border-color: #660300; outline: 2px solid rgba(102, 3, 0, 0.16); }
    </style>
</head>
<body class="grid min-h-screen place-items-center bg-slate-200 p-6 text-slate-900">
    <main class="w-full max-w-[420px]">
        <section class="grid gap-7 rounded-lg border border-slate-300 bg-white p-7">
            <div>
                <strong class="block text-lg text-[#660300]">E-SPPD</strong>
                <small class="mt-0.5 block text-xs text-slate-500">KPU Tolitoli</small>
            </div>

 <form class="grid gap-2.5" method="post">
 {% csrf_token %}
 <h1 class="m-0 text-2xl font-bold">Masuk Aplikasi</h1>
 {% if messages %}
 {% for message in messages %}
 <p class="m-0 rounded-lg bg-amber-50 px-3 py-2.5 text-sm text-amber-700">{{ message }}</p>
 {% endfor %}
 {% endif %}
 {% if form.errors %}
 <p class="m-0 rounded-lg bg-amber-50 px-3 py-2.5 text-sm text-amber-700">Username atau password belum sesuai.</p>
 {% endif %}
 <label class="text-sm font-bold text-slate-500" for="{{ form.username.id_for_label }}">Username</label>
 {{ form.username }}
 <label class="text-sm font-bold text-slate-500" for="{{ form.password.id_for_label }}">Password</label>
 {{ form.password }}
 <button class="mt-2 min-h-11 rounded-lg border-0 bg-[#660300] font-bold text-white hover:bg-[#4f0200]" type="submit">Masuk</button>
 </form>
 </section>
 </main>
 <script>
 for (const input of document.querySelectorAll('input')) {
 input.classList.add('min-h-10', 'w-full', 'rounded-lg', 'border', 'border-slate-300', 'px-3', 'py-2');
 }
 </script>
</body>
</html>
